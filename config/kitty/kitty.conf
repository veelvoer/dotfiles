# Kitty Terminal Configuration
# Color Palette derived from Mountain Horizon Wallpaper

# Fonts
font_family      Inter
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window Layout & Padding
window_padding_width 12
background_opacity   0.92
confirm_os_window_close 0

# Enable the cursor trail animation
cursor_trail 3

# Control how smoothly the trail fades out (fastest and slowest decay times in seconds)
cursor_trail_decay 0.1 0.4

# The minimum distance (in cells) the cursor must move before a trail starts
cursor_trail_start_threshold 2

# Cursor
cursor                #3FD0DC
cursor_text_color     #0D2C34
cursor_shape          beam
cursor_beam_thickness 1.5

# Shell Integration / Mark Colors (Pill Prompting)
mark1_foreground #0D2C34
mark1_background #3FD0DC

mark2_foreground #0D2C34
mark2_background #2BB1BB

mark3_foreground #F2FCFD
mark3_background #12424C

# Color Scheme
background            #0D2C34
foreground            #E8F8FA
selection_background  #186A73
selection_foreground  #F2FCFD
url_color             #2BB1BB

# Terminal Colors (16 Color Palette)

# Black (Deep Mountain Shadows)
color0  #0D2C34
color8  #12424C

# Red (Subtle Accent Warning)
color1  #E06C75
color9  #F38BA8

# Green (Teal Mountain Layers)
color2  #186A73
color10 #2BB1BB

# Yellow (Warm Highlight Accent)
color3  #E5C07B
color11 #F9E2AF

# Blue (Midtone Ridge Shadows)
color4  #219BA4
color12 #3FD0DC

# Magenta (Soft Slate Blue Accent)
color5  #5B82A6
color13 #7FA8CE

# Cyan (Bright Atmosphere / Ridge Glow)
color6  #2BB1BB
color14 #92D5DD

# White (Light Mist Highlights)
color7  #E8F8FA
color15 #F2FCFD